name: Stash Interactive Tools
description: Enhance your Stash Interactive experience
version: 1.1.0-next
url: https://github.com/xtc1337/StashInteractiveTools/
exec:
  - python
  - '{pluginDir}/StashInteractiveTools.py'
errLog: trace
interface: raw
ui:
  css:
    - index.css
  javascript:
    - index.js
  assets:
    /: .
  requires:
    - PythonToolsInstaller
  csp:
    connect-src:
      - 'blob:'
      - 'https://scripts01.handyfeeling.com'
settings:
  disableHapticInterface:
    type: BOOLEAN
    displayName: Disable the use of the Haptic Interface
  hapticInterface:
    type: STRING
    displayName: Choose Haptic Interface to use
  enable_tagging:
    displayName: Enable Tagging Support
    type: BOOLEAN
  multi_script_tag:
    displayName: Name of multi-script tag
    type: STRING
  naming_convention:
    type: STRING
  alwaysDefaultToStashSyncOffset:
    displayName: Always default to using the Stash configured server offset first
    type: BOOLEAN
  handleHandyFileTokens:
    displayName: Handle funscript files that are handy tokens (no ivdb url needed)
    type: BOOLEAN
  remapDisableDuplicates:
    displayName: rename Duplicate funscripts (same exact actions) to .funscriptdupe (disabling them)
    type: BOOLEAN
  remapDisplayTime:
    displayName: add Duration to the generated heatmaps
    type: BOOLEAN
  remapDisplayDefaultText:
    displayName: add Default text to the generated heatmap for the default funscript
    type: BOOLEAN
  remapMapToVideoLength:
    displayName: Map over video duration not funscript length(s) [and flags mismatches]
    type: BOOLEAN
  remapReviewTag:
    displayName: Name of tag to mark items needing review (length or otherwise)
    type: STRING
  remapReplaceZero:
    displayName: Change 0 to 1 for speed on funscripts so the map displays (Warning! Uses direct SQL - Backup!)
    type: BOOLEAN
tasks:
  - name: 'Install'
    description: Install all dependencies & Run migrations
    defaultArgs:
      mode: install
  - name: 'tag'
    description: Apply Tag
    defaultArgs:
      mode: tag
  - name: 'remap'
    description: Build MultiHeatmap
    defaultArgs:
      mode: remap
